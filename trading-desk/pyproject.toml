[project]
name = "trading-desk"
version = "0.1.0"
description = "Multi-agent crypto trading desk: deterministic scout, charts and risk gate plus LLM analysts"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "ccxt>=4.4",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.scripts]
desk = "desk.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["desk"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "I"]

# ArgoDesk in Freqtrade's dry-run (paper) mode. See README.md.
services:
  freqtrade:
    image: freqtradeorg/freqtrade:2026.10
    container_name: argo-freqtrade
    restart: unless-stopped
    volumes:
      - ./user_data:/freqtrade/user_data
      - ./config.paper.json:/freqtrade/config.paper.json:ro
      - ./config.backtest.json:/freqtrade/config.backtest.json:ro
      - ./tools:/freqtrade/tools:ro
    command: >
      trade
      --config config.paper.json
      --db-url sqlite:////freqtrade/user_data/tradesv3.dryrun.sqlite
      --logfile /freqtrade/user_data/logs/freqtrade.log
